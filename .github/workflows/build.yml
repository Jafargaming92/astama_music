name: Build Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      # هذا السطر يحل المشكلة جذرياً: ينشئ كل ملفات الأندرويد الناقصة والحديثة تلقائياً بالسيرفر
      - name: Repair and Create Android Project Setup
        run: flutter create . --platforms=android --org=com.example

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: istama-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
